<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leafer Repo — Репозиторий твиков</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #ffffff;
      --sub: #9ca3af;
      --sileo: #2cb1bc;
      --zebra: #3b82f6;
      --copy: #272b36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: var(--card); max-width: 420px; width: 100%; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); }
    .avatar { width: 96px; height: 96px; border-radius: 22px; object-fit: cover; margin: 0 auto 16px; display: block; box-shadow: 0 8px 20px rgba(0,0,0,0.3); background: #272b36; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: var(--sub); line-height: 1.5; margin-bottom: 24px; }
    .badge { display: inline-block; background: rgba(44, 177, 188, 0.15); color: var(--sileo); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 16px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; text-decoration: none; color: #fff; font-weight: 600; font-size: 16px; margin-bottom: 12px; transition: transform 0.15s ease, opacity 0.15s ease; border: none; cursor: pointer; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn-sileo { background: var(--sileo); }
    .btn-zebra { background: var(--zebra); }
    .btn-copy { background: var(--copy); color: var(--sub); font-size: 14px; margin-bottom: 0; }
    .footer { margin-top: 24px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <img src="CydiaIcon.png" alt="Leafer Repo" class="avatar" onerror="this.style.display='none'">
    <div class="badge">Rootless & Rootful • iOS 15–16+</div>
    <h1>Leafer's Repo</h1>
    <p>Личный репозиторий с проверенными твиками для Sileo и Zebra.</p>

    <a id="sileo-btn" href="#" class="btn btn-sileo">Добавить в Sileo</a>
    <a id="zebra-btn" href="#" class="btn btn-zebra">Добавить в Zebra</a>
    <button id="copy-btn" class="btn btn-copy" onclick="copyRepo()">Скопировать ссылку</button>

    <div class="footer">Powered by GitHub Pages • @leafer95</div>
  </div>

  <script>
    const repoUrl = window.location.origin + window.location.pathname.replace(/index\.html$/, '');
    document.getElementById('sileo-btn').href = 'sileo://source/' + repoUrl;
    document.getElementById('zebra-btn').href = 'zbra://sources/add/' + repoUrl;

    function copyRepo() {
      navigator.clipboard.writeText(repoUrl).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerText = 'Ссылка скопирована!';
        btn.style.color = '#fff';
        setTimeout(() => {
          btn.innerText = 'Скопировать ссылку';
          btn.style.color = '';
        }, 2000);
      });
    }
  </script>
</body>
</html>
